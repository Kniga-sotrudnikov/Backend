{% extends "admin/base_site.html" %}

{% block content %}
<h1>Назначить тег для {{ queryset.count }} сотрудников</h1>

<ul>
  {% for emp in queryset %}
    <li>{{ emp.full_name }}</li>
  {% endfor %}
</ul>

<form method="post">
  {% csrf_token %}
  {% for emp in queryset %}
    <input type="hidden" name="_selected_action" value="{{ emp.pk }}">
  {% endfor %}
  <input type="hidden" name="action" value="assign_tag_action">

  <label for="tag">Выберите тег:</label>
  <select name="tag" id="tag" required>
    {% for tag in tags %}
      <option value="{{ tag.pk }}">{{ tag.name }}</option>
    {% endfor %}
  </select>

  <p>
    <input type="submit" name="apply" value="Применить">
    <a href="..">Отмена</a>
  </p>
</form>
{% endblock %}
